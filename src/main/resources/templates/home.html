<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security6"
      th:replace="~{layout :: layout (~{::title}, ~{::styles}, ~{::content})}">
<head>
    <title>Bem-vindo à TechCar</title>

    <th:block th:fragment="styles">
        <style>
            .welcome-container {
                text-align: center;
                padding: 40px 10px; /* Padding menor */
            }
            .welcome-container h1 {
                font-size: 3.5rem;
                font-weight: 700;
                color: #343a40;
                margin-bottom: 10px;
            }
            .welcome-container .lead {
                font-size: 1.5rem;
                color: #6c757d;
                margin-bottom: 40px;
            }
            .btn-welcome {
                font-size: 1.1rem;
                padding: 12px 25px;
                font-weight: 600;
            }

            /* Título para a seção de destaques */
            .featured-title {
                text-align: center;
                font-size: 2rem;
                color: #343a40;
                margin-top: 40px;
                margin-bottom: 25px;
                border-bottom: 2px solid #e9ecef;
                padding-bottom: 10px;
            }
        </style>
    </th:block>
</head>
<body>
<div th:fragment="content">

    <div class="welcome-container">
        <h1>Bem-vindo à TechCar</h1>
        <p class="lead">O seu marketplace de veículos premium.</p>

        <div sec:authorize="isAnonymous()">
            <a th:href="@{/login}" class="btn btn-primary btn-welcome">Fazer Login</a>
        </div>
        <div sec:authorize="isAuthenticated()">
            <a th:href="@{/app/veiculos}" class="btn btn-primary btn-welcome">Ver Catálogo Completo</a>
        </div>
    </div>

    <h2 class="featured-title">Recém-Adicionados</h2>

    <div class="vehicle-grid">

        <div th:each="veiculo : ${destaques}" class="veiculo-card">

            <img th:src="@{${veiculo.imagemUrl}}" alt="Foto do Veículo">

            <div class="card-content">
                <h3 th:text="${veiculo.marca + ' ' + veiculo.modelo}"></h3>
                <div class="price">R$ <span th:text="${#numbers.formatDecimal(veiculo.preco, 0, 'POINT', 2, 'COMMA')}"></span></div>
                <div class="details"><strong>Ano:</strong> <span th:text="${veiculo.ano}"></span> | <span th:text="${veiculo.descricao}"></span></div>

                <div class="card-actions">
                    <div sec:authorize="hasRole('ADMIN')" style="display: contents;">
                        <a th:href="@{/app/veiculos/{id}/editar(id=${veiculo.id})}" class="btn btn-warning">Editar</a>
                    </div>
                    <div sec:authorize="hasRole('USER')" style="display: contents;">
                        <a th:if="${veiculo.status.toString() == 'DISPONIVEL'}"
                           th:href="@{/app/comprar/{veiculoId}(veiculoId=${veiculo.id})}"
                           class="btn btn-success">Comprar Agora</a>
                        <span th:if="${veiculo.status.toString() == 'VENDIDO'}" class="btn btn-vendido">Vendido</span>
                    </div>
                    <a th:href="@{/app/veiculos/{id}(id=${veiculo.id})}" class="btn btn-primary">Ver Detalhes</a>
                </div>
            </div>
        </div>
    </div> </div>
</body>
</html>
