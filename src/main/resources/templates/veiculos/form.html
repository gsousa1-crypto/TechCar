<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${veiculo.id != null} ? 'Editar Veiculo' : 'Novo Veiculo'">Novo Veiculo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 3px; box-sizing: border-box; }
        .btn { padding: 10px 15px; margin: 5px; text-decoration: none; border-radius: 3px; border: none; cursor: pointer; }
        .btn-primary { background: #007bff; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
    </style>
</head>
<body>
<h1 th:text="${veiculo.id != null} ? 'Editar Veiculo' : 'Novo Veiculo'">Novo Veiculo</h1>

<form th:action="@{/app/veiculos}" th:object="${veiculo}" method="post">
    <!-- CAMPO OCULTO COM O ID (IMPORTANTE!) -->
    <input type="hidden" th:field="*{id}" th:if="${veiculo.id != null}">

    <div class="form-group">
        <label for="marca">Marca:</label>
        <input type="text" id="marca" th:field="*{marca}" required>
    </div>

    <div class="form-group">
        <label for="modelo">Modelo:</label>
        <input type="text" id="modelo" th:field="*{modelo}" required>
    </div>

    <div class="form-group">
        <label for="ano">Ano:</label>
        <input type="number" id="ano" th:field="*{ano}" min="1900" max="2025" required>
    </div>

    <div class="form-group">
        <label for="preco">Preco (R$):</label>
        <input type="number" id="preco" th:field="*{preco}" step="0.01" min="0" required>
    </div>

    <div class="form-group">
        <label for="descricao">Descricao:</label>
        <textarea id="descricao" th:field="*{descricao}" rows="4"></textarea>
    </div>

    <div class="form-group">
        <label for="status">Status:</label>
        <select id="status" th:field="*{status}">
            <option value="DISPONIVEL">Disponivel</option>
            <option value="VENDIDO">Vendido</option>
            <option value="RESERVADO">Reservado</option>
        </select>
    </div>

    <div>
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a th:href="@{/app/veiculos}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
</body>
</html>
