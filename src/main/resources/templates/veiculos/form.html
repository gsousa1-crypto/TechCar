<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security6"
      th:replace="~{layout :: layout (~{::title}, ~{::styles}, ~{::content})}">
<head>
    <title th:text="${veiculoId != null} ? 'Editar Veículo' : 'Novo Veículo'">Formulário de Veículo</title>

    <th:block th:fragment="styles">
        <style>
            .form-container { max-width: 700px; }
            .form-group { margin-bottom: 20px; }
            .form-group label {
                display: block;
                margin-bottom: 5px;
                font-weight: bold;
            }
            .form-group input, .form-group textarea, .form-group select, .form-group input[type="file"] {
                width: 100%;
                padding: 10px;
                border: 1px solid #ced4da;
                border-radius: 5px;
                box-sizing: border-box;
            }
            .form-group input[type="file"]::file-selector-button {
                padding: 8px 12px;
                background-color: #6c757d;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                margin-right: 10px;
            }
            .btn-group { margin-top: 20px; }
            .btn { padding: 10px 15px; text-decoration: none; border-radius: 5px; border: none; cursor: pointer; }
            .btn-primary { background-color: #007bff; color: white; }
            .btn-secondary { background-color: #6c757d; color: white; }

            /* Estilo para erros de validação */
            .error-message {
                color: #dc3545;
                font-size: 0.9em;
                margin-top: 5px;
            }
            .form-group input.error-field, .form-group textarea.error-field {
                border-color: #dc3545;
            }
        </style>
    </th:block>
</head>
<body>
<div th:fragment="content">

    <h1 th:text="${veiculoId != null} ? 'Editar Veículo' : 'Novo Veículo'">Formulário de Veículo</h1>

    <div class="form-container">

        <form th:action="@{/app/veiculos/salvar}" th:object="${veiculoDTO}" method="post"
              enctype="multipart/form-data">

            <input type="hidden" name="id" th:value="${veiculoId}" th:if="${veiculoId != null}">

            <div class="form-group">
                <label for="marca">Marca:</label>
                <input type="text" id="marca" th:field="*{marca}"
                       th:classappend="${#fields.hasErrors('marca')} ? 'error-field' : ''" />
                <div th:if="${#fields.hasErrors('marca')}" th:errors="*{marca}" class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="modelo">Modelo:</label>
                <input type="text" id="modelo" th:field="*{modelo}"
                       th:classappend="${#fields.hasErrors('modelo')} ? 'error-field' : ''" />
                <div th:if="${#fields.hasErrors('modelo')}" th:errors="*{modelo}" class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="ano">Ano:</label>
                <input type="number" id="ano" th:field="*{ano}"
                       th:classappend="${#fields.hasErrors('ano')} ? 'error-field' : ''" />
                <div th:if="${#fields.hasErrors('ano')}" th:errors="*{ano}" class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="preco">Preço (R$):</label>
                <input type="number" id="preco" th:field="*{preco}" step="0.01"
                       th:classappend="${#fields.hasErrors('preco')} ? 'error-field' : ''" />
                <div th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}" class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="descricao">Descrição:</label>
                <textarea id="descricao" th:field="*{descricao}" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label for="imagemFile">Imagem do Veículo (PNG ou JPG):</label>
                <input type="file" id="imagemFile" name="imagemFile" accept="image/png, image/jpeg">
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary">Salvar</button>
                <a th:href="@{/app/veiculos}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
