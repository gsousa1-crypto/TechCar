<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security6"
      th:replace="~{layout :: layout (~{::title}, ~{::styles}, ~{::content})}">
<head>
    <title>Lista de Veículos - TechCar</title>
    <th:block th:fragment="styles">
        <style>
            /* ... (Seus estilos .vehicle-grid, .veiculo-card, etc.) ... */

            /* ✅ NOVO CSS: Estilo para os botões de paginação */
            .pagination-controls {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-top: 25px;
            }
            .pagination-controls .btn {
                flex-grow: 0; /* Não deixa os botões de paginação crescerem */
            }
            .pagination-controls .page-info {
                font-weight: 600;
                color: #495057;
            }
        </style>
    </th:block>
</head>
<body>
<div th:fragment="content">

    <h1 th:text="${#strings.isEmpty(busca)} ? 'Lista de Veículos' : 'Resultados para: ' + ${busca}">Lista de Veículos</h1>

    <div class="vehicle-grid">

        <div th:each="veiculo : ${veiculosPage.content}" class="veiculo-card">

        </div>
    </div> <div th:if="${veiculosPage.empty}" style="margin-top: 20px; text-align: center;">
    <p>Nenhum veículo encontrado com este critério de busca.</p>
</div>

    <nav class="pagination-controls" th:if="${veiculosPage.totalPages > 1}">

        <a th:href="@{/app/veiculos(busca=${busca}, page=${veiculosPage.number - 1})}"
           th:if="${!veiculosPage.first}"
           class="btn btn-secondary">
            &larr; Anterior
        </a>

        <span class="page-info" th:text="'Página ' + ${veiculosPage.number + 1} + ' de ' + ${veiculosPage.totalPages}">
            Página 1 de 5
        </span>

        <a th:href="@{/app/veiculos(busca=${busca}, page=${veiculosPage.number + 1})}"
           th:if="${!veiculosPage.last}"
           class="btn btn-primary">
            Próximo &rarr;
        </a>
    </nav>

    <br>
    <a th:href="@{/app/dashboard}" sec:authorize="hasRole('ADMIN')">← Voltar ao Dashboard</a>
</div>
</body>
</html>
