<header th:fragment="default" class="header"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">

    <div class="header-logo">
        <a th:href="@{/}">
            <img th:src="@{/logo.png}" alt="TechCar Logo">
        </a>
    </div>

    <div class="header-search" sec:authorize="isAuthenticated()">
        <form th:action="@{/app/veiculos}" method="get" class="search-form-header">
            <input type="text" name="busca" placeholder="Buscar por marca...">
            <button type="submit">Buscar</button>
        </form>
    </div>

    <nav class="header-nav">
        <a th:href="@{/app/dashboard}" sec:authorize="hasRole('ADMIN')">Dashboard</a>
        <a th:href="@{/app/veiculos}" sec:authorize="isAuthenticated()">Veículos</a>
        <a th:href="@{/login}" sec:authorize="isAnonymous()">Login</a>

        <span sec:authorize="isAuthenticated()">
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit">Sair</button>
            </form>
        </span>
    </nav>
</header>
