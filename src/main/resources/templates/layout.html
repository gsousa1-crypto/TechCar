<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout (title, styles, content)">
<head>
    <meta charset="UTF-8">
    <title th:replace="${title}">TechCar System</title>
    <th:block th:replace="${styles}" />

    <style>
        /* --- Reset e Sticky Footer --- */
        html, body { height: 100%; margin: 0; padding: 0; background-color: #f4f4f4; }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100%;
        }

        /* --- ESTILOS DO HEADER --- */
        .header {
            background-color: #000000;
            color: white;
            /* ✅ MUDANÇA: Header um pouco mais alto */
            padding: 20px 30px; /* Era 15px 30px */
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #007bff;
        }

        /* Logo */
        .header-logo a { display: inline-block; }
        .header-logo img {
            /* ✅ MUDANÇA: Logo maior */
            height: 60px; /* Era 50px */
            width: auto;
            vertical-align: middle;
        }

        /* Barra de Busca (ajustando padding para o novo header) */
        .search-form-header { display: flex; width: 400px; }
        .search-form-header input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #6c757d;
            border-radius: 5px 0 0 5px;
            border-right: none;
            outline: none;
        }
        .search-form-header button {
            padding: 10px 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 0 5px 5px 0;
            cursor: pointer;
        }

        /* Navegação */
        .header-nav { display: flex; align-items: center; gap: 15px; }
        .header-nav a { color: white; text-decoration: none; font-weight: normal; }
        .header-nav button { /* Botão Sair */
            background: none;
            border: 1px solid #6c757d;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 0.9em;
            padding: 5px 10px;
        }

        /* --- Container e Footer --- */
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            flex-grow: 1;
            width: 90%;
        }
        .footer {
            background-color: #000000;
            color: #aaa;
            padding: 10px 20px;
            text-align: center;
            font-size: 0.9em;
            width: 100%;
            box-sizing: border-box;
            margin-top: auto;
        }
    </style>
</head>
<body>
<div th:replace="~{header :: default}"></div>
<div class="container">
    <div th:replace="${content}"></div>
</div>
<div th:replace="~{footer :: default}"></div>
</body>
</html>
