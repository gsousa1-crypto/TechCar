<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - TechCar</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .login-box { max-width: 400px; margin: 0 auto; padding: 20px;
                    border: 1px solid #ddd; border-radius: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 8px; border: 1px solid #ddd;
            border-radius: 3px; box-sizing: border-box;
        }
        button { width: 100%; padding: 10px; background: #007bff;
                color: white; border: none; border-radius: 3px;
                cursor: pointer; }
        button:hover { background: #0056b3; }
        .error { color: red; margin-top: 10px; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>🔐 Login - TechCar</h2>

    <div th:if="${param.error}" class="error">
        ❌ Email ou senha inválidos!
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Email:</label>
            <input type="text" id="username" name="username"
                   placeholder="admin@techcar.com" required>
        </div>

        <div class="form-group">
            <label for="password">Senha:</label>
            <input type="password" id="password" name="password"
                   placeholder="admin123" required>
        </div>

        <button type="submit">Entrar</button>
    </form>

    <div style="margin-top: 20px; font-size: 0.9em;">
        <p><strong>Usuários de teste:</strong></p>
        <p>👑 Admin: admin@techcar.com / admin123</p>
        <p>👤 User: user@techcar.com / user123</p>
    </div>
</div>
</body>
</html>
