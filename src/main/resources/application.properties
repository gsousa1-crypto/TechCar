# =============================================
# CONFIGURAÇÕES BÁSICAS DA APLICAÇÃO
# =============================================
spring.application.name=tech-car

# =============================================
# BANCO DE DADOS ORACLE
# =============================================
spring.datasource.url=jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
spring.datasource.username=rm566503
spring.datasource.password=fiap25

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# =============================================
# THYMELEAF (TEMPLATES)
# =============================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.servlet.content-type=text/html

# =============================================
# UPLOAD DE ARQUIVOS
# =============================================
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# =============================================
# SPRINGDOC OPENAPI (SWAGGER) - CONFIGURAÇÕES PRINCIPAIS
# =============================================
#springdoc.api-docs.path=/v3/api-docs
#springdoc.swagger-ui.path=/swagger-ui.html
#springdoc.swagger-ui.enabled=true
#springdoc.api-docs.enabled=true

# =============================================
# SPRINGDOC - CONFIGURAÇÕES DE TROUBLESHOOTING
# =============================================
springdoc.model-converters.enum-converter.enabled=false
springdoc.api-docs.resolve-schema-properties=false
springdoc.show-actuator=false
springdoc.cache.disabled=true
springdoc.paths-to-match=/api/**

# =============================================
# CONFIGURAÇÕES DO SERVIDOR
# =============================================
server.port=8080
server.servlet.context-path=/

# Para desenvolvimento - mostrar erros completos
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=true

# =============================================
# LOGGING PARA DEBUG
# =============================================
# SpringDoc logging
logging.level.org.springdoc=DEBUG
logging.level.org.springdoc.api=DEBUG

# Spring Framework logging
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Hibernate/JPA logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Aplicação logging
logging.level.com.nunes=DEBUG
logging.level.com.nunes.tech_car=DEBUG

# =============================================
# CONFIGURAÇÕES DE DESENVOLVIMENTO
# =============================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# =============================================
# SEGURANÇA (PARA TESTE - PODE COMENTAR TEMPORARIAMENTE)
# =============================================
# spring.security.enabled=false

# =============================================
# CONFIGURAÇÕES ADICIONAIS DO SPRINGDOC UI
# =============================================
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none